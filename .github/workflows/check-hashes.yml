name: Check plugin hashes

on:
  push:
    paths:
      - 'plugins/**'
      - 'scripts/update-hashes.mjs'
  pull_request:
    paths:
      - 'plugins/**'
      - 'scripts/update-hashes.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-hashes.mjs --check
